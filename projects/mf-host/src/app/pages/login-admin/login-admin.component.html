<form [formGroup]="loginForm">
  <main class="d-flex w-100">
    <div class="container d-flex flex-column">
      <div class="row vh-100">
        <div class="col-sm-10 col-md-8 col-lg-6 mx-auto d-table h-100">
          <div class="d-table-cell align-middle">

            <div class="text-center mt-4">
              <h1 class="h2">{{ 'LoginAdmin.WelcomeCanchapp' | translate }}</h1>
              <p class="lead">
                {{ 'LoginAdmin.SignInContinue' | translate }}
              </p>
            </div>

            <div class="card">
              <div class="card-body">
                <div class="m-sm-4">
                  <div class="row align-items-center">
                    <div class="col-icon">
                      <div class="icon-big text-center icon-info bubble-shadow-small">
                        <i class="fa-solid fa-circle-user fa-7x"></i>
                      </div>
                    </div>
                  </div>
                  <form>
                    <div class="mb-3">
                      <label class="form-label">{{ 'Commons.Email' | translate }}</label>
                      <input                       
                        id="email" 
                        formControlName="email" 
                        class="form-control form-control-lg" 
                        type="email" 
                        name="email"
                        placeholder="{{ 'LoginAdmin.EnterEmail' | translate }}" />                    
                    </div>
                    <div class="mb-3">
                      <label class="form-label">{{ 'Commons.Password' | translate }}</label>
                      <input 
                        id="password" 
                        formControlName="password"
                        class="form-control form-control-lg" 
                        type="password" 
                        name="password"
                        placeholder="{{ 'LoginAdmin.EnterPassword' | translate }}" />
                      <small>
                        <a href="index.html">{{ 'LoginAdmin.ForgotPassword' | translate }}</a>
                      </small>
                    </div>
                    <div class="text-center mt-3">
                      <button
                        type="button"
                        class="btn btn-lg btn-primary"
                        (click)="onClicklogin()"
                        [disabled]="isLoading">
                        <span class="spinner-border spinner-border-sm" aria-hidden="true" *ngIf="isLoading"></span>
                        {{ 'LoginAdmin.SignIn' | translate }}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>
</form>
